name: Generate Repo Stats

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install and Generate Stats
        uses: lowlighter/metrics@v3
        with:
          token: ${{ secrets.GH_TOKEN }}
          repositories: all
          config_output: svg
          filename: .github/stats.svg
      
      - name: Commit and Push Stats
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/stats.svg
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update repo stats"
          git push
